name: R-CMD-check

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config:
          - {id: ubuntu-devel, os: ubuntu-latest, r: devel, http_user_agent: release}
          - {id: ubuntu-release, os: ubuntu-latest, r: release}
          - {id: ubuntu-oldrel-1, os: ubuntu-latest, r: oldrel-1}
          - {id: macos-release, os: macos-latest, r: release}
          - {id: windows-release, os: windows-latest, r: release}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      READREQ_LIVE_TESTS: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http_user_agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-results: false
          upload-snapshots: false
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'

      - name: Upload check output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r-cmd-check-${{ matrix.config.id }}
          path: |
            check/
            *.Rcheck/
            *.Rout*
          if-no-files-found: warn
          retention-days: 14
