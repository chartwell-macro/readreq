name: pkgdown

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      READREQ_LIVE_TESTS: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Check pkgdown configuration
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build pkgdown site
        run: |
          pkgdown::build_site_github_pages(
            dest_dir = "site",
            clean = TRUE,
            install = FALSE,
            new_process = FALSE
          )
        shell: Rscript {0}

      - name: Upload site artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pkgdown-site
          path: site/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    # Pages is an explicit repository-owner opt-in. Keeping this gated lets the
    # default branch build and verify the site without publishing it.
    if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && vars.PKGDOWN_DEPLOY == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Download site artifact
        uses: actions/download-artifact@v8
        with:
          name: pkgdown-site
          path: site

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: site
          clean: true
          force: false
